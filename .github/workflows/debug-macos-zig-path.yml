name: debug-macos-zig-path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch pinned x86_64 Zig
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-x86_64-macos-0.15.2.tar.xz"
          curl --fail --location --retry 3 --retry-all-errors -o "$archive" https://ziglang.org/download/0.15.2/zig-x86_64-macos-0.15.2.tar.xz
          echo "375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f  $archive" | shasum -a 256 -c -
          root="$RUNNER_TEMP/zig-x86-normal"
          rm -rf "$root"
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root" --strip-components=1
          echo "ZIG_NORMAL=$root" >> "$GITHUB_ENV"
      - name: Compare normal, spaced, and symlinked Zig roots under Rosetta
        shell: bash
        run: |
          set -euo pipefail
          spaced="$RUNNER_TEMP/zig relocated path with spaces"
          link="$RUNNER_TEMP/zig-relocated-link"
          rm -rf "$spaced" "$link"
          cp -R "$ZIG_NORMAL" "$spaced"
          ln -s "$spaced" "$link"
          work="$RUNNER_TEMP/zig probe cwd with spaces"
          rm -rf "$work"
          mkdir -p "$work"
          cat > "$work/probe.c" <<'EOF'
          #include <stdint.h>
          int probe(void) { return (int)sizeof(uint64_t); }
          EOF
          for label in normal spaced symlink; do
            case "$label" in
              normal) zig="$ZIG_NORMAL/zig" ;;
              spaced) zig="$spaced/zig" ;;
              symlink) zig="$link/zig" ;;
            esac
            echo "===== $label ====="
            /usr/bin/file "$zig"
            /usr/bin/arch -x86_64 "$zig" version
            (cd "$work" && /usr/bin/arch -x86_64 "$zig" cc -v -target x86_64-macos.14.0 -c probe.c -o "$label.o")
            /usr/bin/file "$work/$label.o"
          done
