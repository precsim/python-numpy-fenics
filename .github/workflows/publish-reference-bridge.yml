name: publish-reference-bridge

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful qualify-reference-bridge workflow run ID
        required: true
        type: string
      release_tag:
        description: New immutable GitHub release tag
        required: true
        default: reference-bridge-v0.1.0-rc1
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-reference-bridge-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-22.04

    steps:
      - name: Validate qualification run identity
        id: qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*)
              echo "qualification_run_id must be numeric" >&2
              exit 2
              ;;
          esac
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          workflow_name="$(jq -r '.name' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          if [[ "$conclusion" != "success" ]]; then
            echo "qualification run is not successful: $conclusion" >&2
            exit 1
          fi
          if [[ "$workflow_name" != "qualify-reference-bridge" ]]; then
            echo "unexpected source workflow: $workflow_name" >&2
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "qualification run has invalid head SHA: $head_sha" >&2
            exit 1
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact qualified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.qualification.outputs.sha }}

      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download qualified package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: reference-package-*
          path: build/reference/promotion
          merge-multiple: true
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Reverify complete release set offline
        shell: bash
        run: |
          set -euo pipefail
          python consumer-kit/tools/verify-release-set.py --root build/reference/promotion --source-revision "${{ steps.qualification.outputs.sha }}"

      - name: Write release index
        shell: bash
        run: |
          set -euo pipefail
          python consumer-kit/tools/write-release-index.py --root build/reference/promotion --source-revision "${{ steps.qualification.outputs.sha }}" --qualification-run-id "${{ inputs.qualification_run_id }}" --output build/reference/promotion/reference-release-index.json
          python consumer-kit/tools/write-sha256.py build/reference/promotion/reference-release-index.json

      - name: Refuse an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish exact verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFIED_SHA: ${{ steps.qualification.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find build/reference/promotion -type f \( -name 'reference-bridge-*.zip' -o -name 'reference-bridge-*.tar.gz' -o -name 'reference-bridge-*.sha256' -o -name 'qualification-reference-*.json' -o -name 'reference-release-index.json' -o -name 'reference-release-index.json.sha256' \) -print0 | sort -z
          )
          if [[ "${#assets[@]}" -lt 19 ]]; then
            echo "promotion set is unexpectedly small: ${#assets[@]} files" >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/reference-bridge-release-notes.md"
          {
            printf '%s\n\n' 'Public reference bridge packages qualified by GitHub Actions.'
            printf '%s\n' "- Source revision: $QUALIFIED_SHA"
            printf '%s\n' "- Qualification workflow run: $QUALIFICATION_RUN_ID"
            printf '%s\n' '- Python ABI: cp314 / CPython 3.14.10'
            printf '%s\n\n' '- Host qualification: GNU Octave'
            printf '%s\n' 'Each package contains the exact qualified MEX candidate, immutable producer'
            printf '%s\n' 'runtime, offline verifier, checksums, qualification evidence, and a local test'
            printf '%s\n' 'launcher. MATLAB-style MEX aliases are filename-compatible copies only; this'
            printf '%s\n' 'release does not claim MATLAB qualification.'
          } >"$notes_file"
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$QUALIFIED_SHA" --title "$RELEASE_TAG" --notes-file "$notes_file" --prerelease
