name: qualify-linux-fenics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/qualify-linux-fenics.yml"
      - "scripts/linux/**"
      - "scripts/common/**"
      - "runtime/linux/**"
      - "locks/linux/**"
      - "tests/fenics/**"
      - "contracts/**"
      - "config/runtime-matrix.json"
      - "specs/linux/**"
      - "specs/02-core-numpy-profiles.md"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qualify-linux-fenics.yml"
      - "scripts/linux/**"
      - "scripts/common/**"
      - "runtime/linux/**"
      - "locks/linux/**"
      - "tests/fenics/**"
      - "contracts/**"
      - "config/runtime-matrix.json"
      - "specs/linux/**"
      - "specs/02-core-numpy-profiles.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: qualify-linux-fenics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
  MANYLINUX_DIGEST: sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
  OVERLAY_ASSET: fenics-embed-runtime-v0.1.0-linux-x64-cp312.tar.gz

jobs:
  qualify-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Capture checked-out producer revision
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCER_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p ci-artifact build/linux-fenics-overlay dist

      - name: Pull and verify pinned manylinux2014 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MANYLINUX_IMAGE" 2>&1 | tee ci-artifact/manylinux-pull.log
          repo_digests="$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$MANYLINUX_IMAGE")"
          image_arch="$(docker image inspect --format '{{.Architecture}}' "$MANYLINUX_IMAGE")"
          expected_ref="quay.io/pypa/manylinux2014_x86_64@$MANYLINUX_DIGEST"
          printf '%s\n' "$repo_digests" | grep -Fx "$expected_ref"
          test "$image_arch" = amd64
          {
            echo "expected_image=$expected_ref"
            echo "image_architecture=$image_arch"
            echo "repo_digests:"
            printf '%s\n' "$repo_digests"
          } | tee ci-artifact/manylinux-identity.txt
          docker image inspect "$MANYLINUX_IMAGE" > ci-artifact/manylinux-image-inspect.json

      - name: Install host packaging and headless-test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf xvfb
          patchelf --version | tee ci-artifact/patchelf-version.txt
          dpkg-query -W -f='headless_x_package=${Package} version=${Version}\n' xvfb \
            | tee ci-artifact/xvfb-package.txt

      - name: Fetch and verify exact core runtime source inputs
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/linux-glibc217-inputs"
          mkdir -p "$input_dir"

          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/Python-3.12.10.tar.xz" \
            https://www.python.org/ftp/python/3.12.10/Python-3.12.10.tar.xz
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/openssl-3.5.9.tar.gz" \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/libxcrypt-4.5.2.tar.xz" \
            https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/bzip2-devel-1.0.6-13.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/bzip2-devel-1.0.6-13.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/bzip2-libs-1.0.6-13.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/bzip2-libs-1.0.6-13.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/gdbm-devel-1.10-8.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/gdbm-devel-1.10-8.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/gdbm-1.10-8.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/gdbm-1.10-8.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/libffi-devel-3.0.13-19.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/libffi-devel-3.0.13-19.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/libffi-3.0.13-19.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/libffi-3.0.13-19.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/libuuid-devel-2.23.2-65.el7_9.1.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/updates/x86_64/Packages/libuuid-devel-2.23.2-65.el7_9.1.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/libuuid-2.23.2-65.el7_9.1.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/updates/x86_64/Packages/libuuid-2.23.2-65.el7_9.1.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/ncurses-devel-5.9-14.20130511.el7_4.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/ncurses-devel-5.9-14.20130511.el7_4.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/ncurses-5.9-14.20130511.el7_4.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/ncurses-5.9-14.20130511.el7_4.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/readline-devel-6.2-11.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/readline-devel-6.2-11.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/readline-6.2-11.el7.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/os/x86_64/Packages/readline-6.2-11.el7.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/xz-devel-5.2.2-2.el7_9.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/updates/x86_64/Packages/xz-devel-5.2.2-2.el7_9.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/xz-libs-5.2.2-2.el7_9.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/updates/x86_64/Packages/xz-libs-5.2.2-2.el7_9.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/zlib-1.2.7-21.el7_9.x86_64.rpm" \
            https://vault.centos.org/7.9.2009/updates/x86_64/Packages/zlib-1.2.7-21.el7_9.x86_64.rpm
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/tcl8.6.12-src.tar.gz" \
            https://prdownloads.sourceforge.net/tcl/tcl8.6.12-src.tar.gz
          curl --fail --location --retry 3 --retry-all-errors --output "$input_dir/tk8.6.12-src.tar.gz" \
            https://prdownloads.sourceforge.net/tcl/tk8.6.12-src.tar.gz

          (
            cd "$input_dir"
            cat <<'EOF' | sha256sum -c -
          07ab697474595e06f06647417d3c7fa97ded07afc1a7e4454c5639919b46eaea  Python-3.12.10.tar.xz
          603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl-3.5.9.tar.gz
          71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071  libxcrypt-4.5.2.tar.xz
          28e0eef4dfa7e5a79bd4e46a5174091c87027a2b2e33e1e9e19958bcc1ac6700  bzip2-devel-1.0.6-13.el7.x86_64.rpm
          1fd32866a2a82f5abc19142b59dce8fd961bc1d32e3bedfa0de7a950066fdaa5  bzip2-libs-1.0.6-13.el7.x86_64.rpm
          fc02a803f89c0d68de96bcc7a46d7cdf8768e62577b27aed9c531e6fb2818c30  gdbm-devel-1.10-8.el7.x86_64.rpm
          65f28fdefa291bfe53e9c8646ce0f7510f312a4fee232af36e3d4fe678b60591  gdbm-1.10-8.el7.x86_64.rpm
          a31ba33f74252929d396e4d8557fe1c40be95d777aad0660771b14f1187b3b2e  libffi-devel-3.0.13-19.el7.x86_64.rpm
          670463ed744b7243cfe32f0c4aa6676657a6078a6e2009a51fdb7b907b98ef71  libffi-3.0.13-19.el7.x86_64.rpm
          edc0594488f23ae7a46857065d3cd4d74e61a711b96dd5b99713419b033816a4  libuuid-devel-2.23.2-65.el7_9.1.x86_64.rpm
          f530a65c0efca53f618f63e02801129283b12266fbf21ac221e35617a45b0d4b  libuuid-2.23.2-65.el7_9.1.x86_64.rpm
          1c93fc77242cf1129f1aa44a8e31fa118511681776d17f0ffb2c3e84bb811a6d  ncurses-devel-5.9-14.20130511.el7_4.x86_64.rpm
          59773dff8c5aa8f084fd2edc88b5dc34f574f254ec98280fc2b0adafe07f85a2  ncurses-5.9-14.20130511.el7_4.x86_64.rpm
          dd4f93b315f8a2facdd3508ac5b7fe070d663d4ebf70cdfa2781ffb6abd25160  readline-devel-6.2-11.el7.x86_64.rpm
          d9e52b61beb1ac9c3006604d9ebd4f930f667b64478a61fd78de7ed74922f52e  readline-6.2-11.el7.x86_64.rpm
          8c62263350421e7c3081b4a531f8e15ef5bfb5e410a34687ca4a799ff23362ef  xz-devel-5.2.2-2.el7_9.x86_64.rpm
          4b698de5fd7e0a64306106f3018e9d00dedc1f7a46d354339f012c97d004bd0c  xz-libs-5.2.2-2.el7_9.x86_64.rpm
          2bee86d12902723756eafa82ba6cc322136c4a67a78e0104ac988e14eb7fb5a1  zlib-1.2.7-21.el7_9.x86_64.rpm
          26c995dd0f167e48b11961d891ee555f680c175f7173ff8cb829f4ebcde4c1a6  tcl8.6.12-src.tar.gz
          12395c1f3fcb6bed2938689f797ea3cdf41ed5cb6c4766eec8ac949560310630  tk8.6.12-src.tar.gz
          EOF
          ) | tee ci-artifact/core-source-inputs.sha256

      - name: Build controlled core runtime in pinned glibc 2.17 container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env PY_RUNTIME_BUILD_IMAGE_REF="$MANYLINUX_IMAGE" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/linux-glibc217-inputs:/inputs:ro" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(uname -m)" = x86_64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              exec bash scripts/linux/build-core-runtime.sh \
                --python-source /inputs/Python-3.12.10.tar.xz \
                --openssl-source /inputs/openssl-3.5.9.tar.gz \
                --libxcrypt-source /inputs/libxcrypt-4.5.2.tar.xz \
                --dev-rpm-dir /inputs \
                --tcl-source /inputs/tcl8.6.12-src.tar.gz \
                --tk-source /inputs/tk8.6.12-src.tar.gz
            ' 2>&1 | tee ci-artifact/linux-glibc217-core-build.log

      - name: Start host Xvfb for inherited core qualification
        shell: bash
        run: |
          set -euo pipefail
          display=:99
          socket=/tmp/.X11-unix/X99
          echo "DISPLAY=$display" >> "$GITHUB_ENV"
          nohup Xvfb "$display" -screen 0 1024x768x24 -nolisten tcp -ac \
            >ci-artifact/xvfb.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/linux-fenics-xvfb.pid"
          for _ in {1..100}; do
            [[ -S "$socket" ]] && exit 0
            sleep 0.1
          done
          cat ci-artifact/xvfb.log >&2 || true
          exit 1

      - name: Qualify inherited core runtime offline in pinned container
        shell: bash
        run: |
          set -euo pipefail
          test -S "/tmp/.X11-unix/X${DISPLAY#:}"
          docker run --rm --network none \
            --env "DISPLAY=$DISPLAY" \
            --env PY_RUNTIME_BUILD_IMAGE_REF="$MANYLINUX_IMAGE" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume /tmp/.X11-unix:/tmp/.X11-unix:ro \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            bash scripts/linux/test-core-runtime.sh --image "$MANYLINUX_IMAGE" \
            2>&1 | tee ci-artifact/linux-glibc217-core-test.log

      - name: Fetch and verify exact NumPy build inputs
        shell: bash
        run: |
          set -euo pipefail
          manifest=locks/linux/linux-glibc217-numpy-sources.json
          input_root="$RUNNER_TEMP/linux-glibc217-numpy-inputs"
          rm -rf "$input_root"
          mkdir -p "$input_root"
          python3 - "$manifest" "$RUNNER_TEMP/numpy-download-inputs.tsv" <<'PY'
          import json
          import pathlib
          import re
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          output = pathlib.Path(sys.argv[2])
          sha_re = re.compile(r"^[0-9a-fA-F]{64}$")
          inputs = {}

          def visit(node, path="$"):
              if isinstance(node, dict):
                  url = node.get("url")
                  sha256 = node.get("sha256")
                  filename = node.get("filename")
                  if isinstance(url, str) and isinstance(sha256, str):
                      if not isinstance(filename, str) or not filename:
                          filename = pathlib.PurePosixPath(url.split("?", 1)[0]).name
                      if not filename or pathlib.PurePath(filename).name != filename:
                          raise SystemExit(f"invalid pinned input filename at {path}: {filename!r}")
                      if not url.startswith("https://") or not sha_re.fullmatch(sha256):
                          raise SystemExit(f"invalid pinned input at {path}: {url!r} {sha256!r}")
                      previous = inputs.setdefault(filename, (url, sha256.lower()))
                      if previous != (url, sha256.lower()):
                          raise SystemExit(f"conflicting pinned inputs use filename {filename!r}")
                  for key, value in node.items():
                      visit(value, f"{path}.{key}")
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      visit(value, f"{path}[{index}]")

          visit(data)
          if not inputs:
              raise SystemExit("NumPy source manifest contains no pinned downloads")
          output.write_text(
              "".join(f"{name}\t{url}\t{sha}\n" for name, (url, sha) in sorted(inputs.items())),
              encoding="utf-8",
          )
          PY
          while IFS=$'\t' read -r filename url expected_sha; do
            destination="$input_root/$filename"
            curl --fail --location --retry 3 --retry-all-errors --output "$destination" "$url"
            actual_sha="$(sha256sum "$destination" | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
            printf '%s  %s\n' "$actual_sha" "$filename"
          done < "$RUNNER_TEMP/numpy-download-inputs.tsv" | tee ci-artifact/numpy-download-inputs.sha256
          cp "$manifest" "$input_root/linux-glibc217-numpy-sources.json"
          echo "NUMPY_INPUT_ROOT=$input_root" >> "$GITHUB_ENV"

      - name: Build controlled NumPy runtime offline in pinned glibc 2.17 container
        shell: bash
        run: |
          set -euo pipefail
          core_before="$(sha256sum out/linux-x64/core/build-provenance-linux.json | awk '{print $1}')"
          docker run --rm --network none \
            --env PY_RUNTIME_BUILD_IMAGE_REF="$MANYLINUX_IMAGE" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$NUMPY_INPUT_ROOT:/inputs:ro" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            bash scripts/linux/build-numpy-runtime.sh \
              --core-runtime /workspace/out/linux-x64/core \
              --input-root /inputs \
              --sources-manifest /workspace/locks/linux/linux-glibc217-numpy-sources.json \
              --output-runtime /workspace/out/linux-x64/numpy \
            2>&1 | tee ci-artifact/linux-glibc217-numpy-build.log
          core_after="$(sha256sum out/linux-x64/core/build-provenance-linux.json | awk '{print $1}')"
          test "$core_after" = "$core_before"

      - name: Qualify controlled NumPy runtime offline in pinned glibc 2.17 container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env PY_RUNTIME_BUILD_IMAGE_REF="$MANYLINUX_IMAGE" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$NUMPY_INPUT_ROOT:/inputs:ro" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            bash scripts/linux/test-numpy-runtime.sh \
              --core-runtime /workspace/out/linux-x64/core \
              --runtime /workspace/out/linux-x64/numpy \
              --sources-manifest /workspace/locks/linux/linux-glibc217-numpy-sources.json \
              --input-root /inputs \
              --image "$MANYLINUX_IMAGE" \
            2>&1 | tee ci-artifact/linux-glibc217-numpy-test.log
          sudo chown -R "$(id -u):$(id -g)" out build 2>/dev/null || true

      - name: Freeze qualified public NumPy base handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/common/write_runtime_manifest.py \
            --root out/linux-x64/numpy \
            --platform linux-x64 \
            --profile numpy
          python3 scripts/common/archive_runtime.py \
            --root out/linux-x64/numpy \
            --output dist/python-runtime-v0.1.0-linux-x64-cp312-numpy.tar.gz \
            --format tar.gz
          sha256sum dist/python-runtime-v0.1.0-linux-x64-cp312-numpy.tar.gz \
            > dist/python-runtime-v0.1.0-linux-x64-cp312-numpy.tar.gz.sha256
          python3 scripts/common/write_qualification.py \
            --platform linux-x64 \
            --profile numpy \
            --artifact dist/python-runtime-v0.1.0-linux-x64-cp312-numpy.tar.gz \
            --output dist/qualification-linux-x64-numpy-base.json \
            --check pinned_manylinux=pass \
            --check glibc_floor=pass \
            --check inherited_core_identity=pass \
            --check numpy_source_build=pass \
            --check private_openblas=pass \
            --check blas_lapack_functional=pass \
            --check native_closure=pass \
            --check private_consumer_checkout=not-applicable

      - name: Install pinned micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-version: '2.10.0-0'

      - name: Replay and verify exact 128-record FEniCS lock without solving
        shell: bash
        run: |
          set -euo pipefail
          lock=locks/linux/linux-x86_64-fenics-package-lock.json
          source_explicit=locks/linux/linux-x86_64-fenics-explicit.txt
          transaction="$RUNNER_TEMP/linux-x86_64-fenics-explicit.txt"
          prefix="$RUNNER_TEMP/linux-fenics-locked-prefix"
          package_cache="$MAMBA_ROOT_PREFIX/pkgs"
          evidence=build/linux-fenics-overlay
          rm -rf "$prefix"
          mkdir -p "$evidence"

          "$MAMBA_EXE" --version | tee "$evidence/micromamba-version.txt"
          python3 scripts/linux/package_lock.py explicit \
            --lock "$lock" \
            --source-explicit "$source_explicit" \
            --output "$transaction" \
            --arch x86_64 \
            | tee "$evidence/package-lock-render.log"
          grep -Fx 'dependency_solver=disabled' "$evidence/package-lock-render.log"
          cp "$transaction" "$evidence/locked-explicit.txt"

          # @EXPLICIT is an immutable URL + SHA-256 transaction. No channel,
          # matchspec or dependency solve participates in this replay.
          CONDA_SUBDIR=linux-64 "$MAMBA_EXE" create -y \
            -p "$prefix" \
            --file "$transaction" \
            2>&1 | tee "$evidence/package-lock-replay.log"

          python3 scripts/linux/package_lock.py verify-prefix \
            --lock "$lock" \
            --prefix "$prefix" \
            --package-cache "$package_cache" \
            --explicit "$transaction" \
            --evidence "$evidence/package-lock-verification.json" \
            --arch x86_64 \
            | tee "$evidence/package-lock-verification.log"
          python3 - "$evidence/package-lock-verification.json" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["solver_used"] is False
          assert data["lock_record_count"] == 128
          assert data["installed_record_count"] == 128
          assert data["verified_package_archive_count"] == 128
          assert data["package_hash_verification"] == "cached-package-sha256-plus-installed-record-match"
          assert data["replay_input_format"] == "@EXPLICIT-url-plus-sha256"
          assert len(data["packages"]) == 128
          print("exact_lock_replay=pass")
          PY
          echo "FENICS_LOCK_FILE=$lock" >> "$GITHUB_ENV"
          echo "FENICS_LOCKED_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FENICS_PACKAGE_CACHE=$package_cache" >> "$GITHUB_ENV"
          echo "FENICS_OVERLAY_EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Package relocatable stock FEniCS overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/linux/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --prefix-evidence "$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --lock "$FENICS_LOCK_FILE" \
            --base-runtime out/linux-x64/numpy \
            --base-qualification dist/qualification-linux-x64-numpy-base.json \
            --output dist \
            --version 0.1.0 \
            --producer-revision "$PRODUCER_REVISION" \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/package-overlay.log"
          test -f "dist/$OVERLAY_ASSET"
          test -f "dist/$OVERLAY_ASSET.json"
          test -f "dist/$OVERLAY_ASSET.sha256"

      - name: Qualify overlay offline inside pinned glibc 2.17 container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env PATH=/opt/python/cp312-cp312/bin:/usr/local/bin:/usr/bin:/bin \
            --env "OVERLAY_ASSET=$OVERLAY_ASSET" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(uname -m)" = x86_64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              python3 --version
              exec bash scripts/linux/test-fenics-overlay.sh \
                --archive "/workspace/dist/$OVERLAY_ASSET" \
                --base-runtime /workspace/out/linux-x64/numpy \
                --base-qualification /workspace/dist/qualification-linux-x64-numpy-base.json
            ' 2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/public-base-overlay-test.log"

      - name: Repackage overlay and prove deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-repeat
          python3 scripts/linux/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --prefix-evidence "$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --lock "$FENICS_LOCK_FILE" \
            --base-runtime out/linux-x64/numpy \
            --base-qualification dist/qualification-linux-x64-numpy-base.json \
            --output dist-repeat \
            --version 0.1.0 \
            --producer-revision "$PRODUCER_REVISION" \
            > "$FENICS_OVERLAY_EVIDENCE/package-overlay-repeat.log"
          cmp "dist/$OVERLAY_ASSET" "dist-repeat/$OVERLAY_ASSET"
          cmp "dist/$OVERLAY_ASSET.json" "dist-repeat/$OVERLAY_ASSET.json"
          cmp "dist/$OVERLAY_ASSET.sha256" "dist-repeat/$OVERLAY_ASSET.sha256"
          echo 'deterministic_overlay_rebuild=pass' \
            > "$FENICS_OVERLAY_EVIDENCE/deterministic-rebuild.txt"

      - name: Collect immutable Linux FEniCS evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$FENICS_OVERLAY_EVIDENCE"
          cp ci-artifact/manylinux-identity.txt "$evidence/"
          cp ci-artifact/manylinux-image-inspect.json "$evidence/"
          cp dist/qualification-linux-x64-numpy-base.json "$evidence/"
          cp out/linux-x64/numpy/runtime-manifest.json "$evidence/numpy-base-runtime-manifest.json"
          cp out/linux-x64/numpy/build-provenance-linux.json "$evidence/numpy-base-core-provenance.json"
          cp out/linux-x64/numpy/build-provenance-linux-numpy.json "$evidence/numpy-base-build-provenance.json"
          cp out/linux-x64/numpy/numpy-payload-manifest-linux.json "$evidence/numpy-base-payload-manifest.json"
          cp locks/linux/linux-x86_64-fenics-package-lock.json "$evidence/"
          cp locks/linux/linux-x86_64-fenics-explicit.txt "$evidence/"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-embed-manifest.json \
            > "$evidence/fenics-embed-manifest.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/package-provenance.json \
            > "$evidence/package-provenance.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/source-provenance.json \
            > "$evidence/source-provenance.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/native-dependency-census.json \
            > "$evidence/native-dependency-census.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/license-inventory.json \
            > "$evidence/license-inventory.json"
          cp "dist/$OVERLAY_ASSET.json" "$evidence/"
          cp "dist/$OVERLAY_ASSET.sha256" "$evidence/"
          sha256sum \
            "$evidence/fenics-embed-manifest.json" \
            "$evidence/package-provenance.json" \
            "$evidence/source-provenance.json" \
            "$evidence/native-dependency-census.json" \
            "$evidence/license-inventory.json" \
            "$evidence/package-lock-verification.json" \
            "$evidence/qualification-linux-x64-numpy-base.json" \
            "$evidence/numpy-base-runtime-manifest.json" \
            "$evidence/numpy-base-core-provenance.json" \
            "$evidence/numpy-base-build-provenance.json" \
            "$evidence/numpy-base-payload-manifest.json" \
            "$evidence/linux-x86_64-fenics-package-lock.json" \
            "$evidence/linux-x86_64-fenics-explicit.txt" \
            "$evidence/manylinux-identity.txt" \
            > "$evidence/overlay-evidence-sha256.txt"

      - name: Write Linux FEniCS producer qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/common/write_qualification.py \
            --platform linux-x64 \
            --profile fenics \
            --artifact "dist/$OVERLAY_ASSET" \
            --output "$FENICS_OVERLAY_EVIDENCE/qualification-linux-x64-fenics.json" \
            --check pinned_manylinux=pass \
            --check glibc_floor=pass \
            --check package_lock_replay=pass \
            --check package_hash_verification=pass \
            --check dependency_solver_disabled=pass \
            --check stock_package_reuse=pass \
            --check public_numpy_base=pass \
            --check inherited_numpy_identity=pass \
            --check producer_python_excluded=pass \
            --check producer_numpy_excluded=pass \
            --check hostile_ambient_state=pass \
            --check relocation=pass \
            --check fresh_ffcx_jit=pass \
            --check serial_petsc_solve=pass \
            --check mpich_provider=pass \
            --check native_closure=pass \
            --check native_symbol_ceilings=pass \
            --check deterministic_archive=pass \
            --check private_consumer_checkout=not-applicable
          sha256sum \
            "dist/$OVERLAY_ASSET" \
            "dist/$OVERLAY_ASSET.json" \
            "$FENICS_OVERLAY_EVIDENCE/qualification-linux-x64-fenics.json" \
            "$FENICS_OVERLAY_EVIDENCE/fenics-embed-manifest.json" \
            "$FENICS_OVERLAY_EVIDENCE/package-provenance.json" \
            "$FENICS_OVERLAY_EVIDENCE/source-provenance.json" \
            "$FENICS_OVERLAY_EVIDENCE/native-dependency-census.json" \
            "$FENICS_OVERLAY_EVIDENCE/license-inventory.json" \
            > "$FENICS_OVERLAY_EVIDENCE/SHA256SUMS-linux-fenics.txt"

      - name: Upload qualified Linux FEniCS overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fenics-embed-runtime-linux-x64-cp312
          path: |
            dist/fenics-embed-runtime-v0.1.0-linux-x64-cp312.tar.gz
            dist/fenics-embed-runtime-v0.1.0-linux-x64-cp312.tar.gz.json
            dist/fenics-embed-runtime-v0.1.0-linux-x64-cp312.tar.gz.sha256
            build/linux-fenics-overlay/
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p ci-artifact/fenics-failure
          cp -R build/linux-fenics-overlay ci-artifact/fenics-failure/ 2>/dev/null || true
          find out/linux-x64/numpy build/linux-fenics-overlay -maxdepth 5 \
            \( -type f -o -type l \) -print 2>/dev/null | sort \
            > ci-artifact/fenics-failure/tree.txt
          while IFS= read -r log; do
            echo "===== $log ====="
            tail -n 250 "$log"
          done < <(find ci-artifact build/linux-fenics-overlay -type f -name '*.log' -print 2>/dev/null | sort)

      - name: Upload Linux FEniCS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualify-linux-fenics-diagnostics-${{ github.run_id }}
          path: ci-artifact/
          if-no-files-found: warn
          retention-days: 1

      - name: Stop host Xvfb
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/linux-fenics-xvfb.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
