name: qualify-linux-fenics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-linux-fenics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
  MANYLINUX_DIGEST: sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
  NUMPY_BASE_TAG: runtime-v0.1.0-rc1
  NUMPY_BASE_ARCHIVE: dist/python-runtime-v0.1.0-linux-x64-cp314-numpy.tar.gz
  OVERLAY_ASSET: fenics-embed-runtime-v0.1.0-linux-x64-cp314.tar.gz

jobs:
  qualify-overlay:
    name: qualify-linux-fenics
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Capture checked-out producer revision
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCER_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p ci-artifact build/linux-fenics-overlay dist

      - name: Run Linux FEniCS native rebuild static tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.common.test_linux_fenics_python_builder
          python3 -m unittest tests.common.test_linux_fenics_libxml2_build_deps
          python3 -m unittest tests.common.test_linux_fenics_native_handoff
          python3 -m unittest tests.common.test_linux_fenics_native_candidate_audit
          python3 -m unittest discover -s tests -p 'test_linux_fenics_native_rebuild.py'
          python3 -m unittest discover -s tests/common -p 'test_linux_fenics_icu_edge.py'

      - name: Enforce cp314 FEniCS native package identities
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/linux/check_fenics_cp314_lock.py \
            --lock locks/linux/linux-x86_64-fenics-package-lock.json

      - name: Pull and verify pinned manylinux2014 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MANYLINUX_IMAGE" 2>&1 | tee ci-artifact/manylinux-pull.log
          repo_digests="$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$MANYLINUX_IMAGE")"
          image_arch="$(docker image inspect --format '{{.Architecture}}' "$MANYLINUX_IMAGE")"
          expected_ref="quay.io/pypa/manylinux2014_x86_64@$MANYLINUX_DIGEST"
          printf '%s\n' "$repo_digests" | grep -Fx "$expected_ref"
          test "$image_arch" = amd64
          {
            echo "expected_image=$expected_ref"
            echo "image_architecture=$image_arch"
            echo "repo_digests:"
            printf '%s\n' "$repo_digests"
          } | tee ci-artifact/manylinux-identity.txt
          docker image inspect "$MANYLINUX_IMAGE" > ci-artifact/manylinux-image-inspect.json

      - name: Install host packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf
          patchelf --version | tee ci-artifact/patchelf-version.txt

      - name: Restore immutable qualified NumPy base from published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/common/restore_qualified_numpy_base.py \
            --tag "$NUMPY_BASE_TAG" \
            --platform linux-x64 \
            --output out/linux-x64/numpy \
            --qualification-output dist/qualification-linux-x64-numpy-base.json \
            --archive-output "$NUMPY_BASE_ARCHIVE"
          python3 - locks/core/fenics-numpy-base-release.json \
            out/linux-x64/numpy/runtime-manifest.json \
            dist/qualification-linux-x64-numpy-base.json \
            "$NUMPY_BASE_TAG" <<'PY'
          import json
          import os
          import pathlib
          import sys

          pin_path = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])
          qualification_path = pathlib.Path(sys.argv[3])
          expected_tag = sys.argv[4]
          pin = json.loads(pin_path.read_text(encoding="utf-8-sig"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
          qualification = json.loads(qualification_path.read_text(encoding="utf-8-sig"))
          if pin.get("repository") != "precsim/python-numpy-fenics" or pin.get("tag") != expected_tag:
              raise SystemExit(f"NumPy base release pin does not match requested release: {pin_path}")
          expected_revision = pin.get("producer_revision")
          manifest_revision = manifest.get("producer", {}).get("revision")
          qualification_revision = qualification.get("producer_revision")
          if manifest_revision != expected_revision or qualification_revision != expected_revision:
              raise SystemExit(
                  "restored NumPy base revision mismatch: "
                  f"manifest={manifest_revision!r} qualification={qualification_revision!r} "
                  f"expected={expected_revision!r}"
              )
          if qualification.get("platform") != "linux-x64" or qualification.get("profile") != "numpy":
              raise SystemExit("restored NumPy base qualification identity is invalid")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"NUMPY_BASE_REVISION={expected_revision}\n")
          print(f"numpy_base_revision={expected_revision}")
          PY
      - name: Install pinned micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-version: '2.10.0-0'

      - name: Replay and verify exact 124-record FEniCS lock without solving
        shell: bash
        run: |
          set -euo pipefail
          lock=locks/linux/linux-x86_64-fenics-package-lock.json
          source_explicit=locks/linux/linux-x86_64-fenics-explicit.txt
          transaction="$RUNNER_TEMP/linux-x86_64-fenics-explicit.txt"
          prefix="$RUNNER_TEMP/linux-fenics-locked-prefix"
          package_cache="$MAMBA_ROOT_PREFIX/pkgs"
          evidence=build/linux-fenics-overlay
          rm -rf "$prefix"
          mkdir -p "$evidence"

          "$MAMBA_EXE" --version | tee "$evidence/micromamba-version.txt"
          python3 scripts/linux/package_lock.py explicit \
            --lock "$lock" \
            --source-explicit "$source_explicit" \
            --output "$transaction" \
            --arch x86_64 \
            | tee "$evidence/package-lock-render.log"
          grep -Fx 'dependency_solver=disabled' "$evidence/package-lock-render.log"
          cp "$transaction" "$evidence/locked-explicit.txt"

          # @EXPLICIT is an immutable URL + SHA-256 transaction. No channel,
          # matchspec or dependency solve participates in this replay.
          CONDA_SUBDIR=linux-64 "$MAMBA_EXE" create -y \
            -p "$prefix" \
            --file "$transaction" \
            2>&1 | tee "$evidence/package-lock-replay.log"

          python3 scripts/linux/package_lock.py verify-prefix \
            --lock "$lock" \
            --prefix "$prefix" \
            --package-cache "$package_cache" \
            --explicit "$transaction" \
            --evidence "$evidence/package-lock-verification.json" \
            --arch x86_64 \
            | tee "$evidence/package-lock-verification.log"
          python3 - "$evidence/package-lock-verification.json" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["solver_used"] is False
          assert data["lock_record_count"] == 124
          assert data["installed_record_count"] == 124
          assert data["verified_package_archive_count"] == 124
          assert data["package_hash_verification"] == "cached-package-sha256-plus-installed-record-match"
          assert data["replay_input_format"] == "@EXPLICIT-url-plus-sha256"
          assert len(data["packages"]) == 124
          print("exact_lock_replay=pass")
          PY
          echo "FENICS_LOCK_FILE=$lock" >> "$GITHUB_ENV"
          echo "FENICS_SOURCE_EXPLICIT=$source_explicit" >> "$GITHUB_ENV"
          echo "FENICS_LOCKED_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FENICS_PACKAGE_CACHE=$package_cache" >> "$GITHUB_ENV"
          echo "FENICS_OVERLAY_EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Capture required stock ABI failure evidence
        shell: bash
        run: |
          set -euo pipefail
          preflight="$FENICS_OVERLAY_EVIDENCE/stock-native-abi-preflight.json"
          set +e
          python3 scripts/linux/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --prefix-evidence "$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --lock "$FENICS_LOCK_FILE" \
            --base-runtime out/linux-x64/numpy \
            --base-qualification dist/qualification-linux-x64-numpy-base.json \
            --base-producer-revision "$NUMPY_BASE_REVISION" \
            --abi-preflight-evidence "$preflight" \
            --output dist \
            --version 0.1.0 \
            --producer-revision "$PRODUCER_REVISION" \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/stock-package-expected-failure.log"
          package_status=${PIPESTATUS[0]}
          set -e
          if [[ "$package_status" -eq 0 ]]; then
            echo "stock FEniCS overlay unexpectedly passed; selective rebuild prototype has no executable justification" >&2
            exit 1
          fi
          test -f "$preflight"
          python3 - "$preflight" <<'PY'
          import json
          import pathlib
          import re
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_packages = [
              "fenics-basix",
              "fenics-dolfinx",
              "fenics-libbasix",
              "fenics-libdolfinx",
              "fmt",
              "icu",
              "kahip",
              "libadios2",
              "pugixml",
              "spdlog",
              "zeromq",
          ]
          assert data["format_version"] == 1
          assert data["stage"] == "stock-binary-closure-before-selective-rebuild"
          assert data["status"] == "fail"
          assert data["source_rebuilds_authorized"] is False
          assert data["violation_count"] == 164
          assert data["violating_packages"] == expected_packages
          assert re.fullmatch(r"[0-9a-f]{64}", data["selection_fingerprint_sha256"])
          print(f"stock_abi_violation_count={data['violation_count']}")
          print(f"stock_abi_selection_fingerprint={data['selection_fingerprint_sha256']}")
          PY
          sha256sum "$preflight" > "$FENICS_OVERLAY_EVIDENCE/stock-native-abi-preflight.sha256"
          echo "FENICS_STOCK_ABI_PREFLIGHT=$preflight" >> "$GITHUB_ENV"

      - name: Fetch and verify pinned public native rebuild sources
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/linux-fenics-rebuild-sources"
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          rm -rf "$source_dir" "$prototype"
          mkdir -p "$source_dir" "$prototype"
          python3 scripts/linux/fetch_fenics_rebuild_sources.py \
            --manifest locks/linux/linux-x86_64-fenics-rebuild-sources.json \
            --output-dir "$source_dir" \
            --evidence "$prototype/source-inputs.json" \
            | tee "$prototype/source-fetch.log"
          echo "FENICS_REBUILD_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Fetch and verify pinned public curl ICU-edge inputs
        shell: bash
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/linux-fenics-icu-edge-inputs"
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          rm -rf "$input_dir"
          python3 scripts/linux/probe_fenics_icu_edge.py fetch \
            --contract locks/linux/linux-x86_64-fenics-icu-edge-probe.json \
            --output-dir "$input_dir" \
            --evidence "$prototype/icu-edge-public-inputs.json" \
            | tee "$prototype/icu-edge-public-inputs.log"
          echo "FENICS_ICU_EDGE_INPUT_DIR=$input_dir" >> "$GITHUB_ENV"

      - name: Fetch and verify pinned public Python builder wheels
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/linux-fenics-python-builder-wheels"
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"
          python3 scripts/linux/prepare_fenics_python_builder.py fetch \
            --lock locks/linux/linux-x86_64-fenics-python-builder-wheels.json \
            --numpy-source-manifest locks/linux/linux-glibc217-numpy-sources.json \
            --fenics-package-lock "$FENICS_LOCK_FILE" \
            --output-dir "$wheel_dir" \
            --evidence "$prototype/python-builder-wheel-inputs.json" \
            | tee "$prototype/python-builder-wheel-fetch.log"
          echo "FENICS_PYTHON_BUILDER_WHEELS=$wheel_dir" >> "$GITHUB_ENV"

      - name: Prepare pinned Python wheel builder offline on glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          builder="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype/python-builder"
          rm -rf "$builder"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /opt/python/cp314-cp314/bin/python \
              scripts/linux/prepare_fenics_python_builder.py prepare \
              --lock locks/linux/linux-x86_64-fenics-python-builder-wheels.json \
              --numpy-source-manifest locks/linux/linux-glibc217-numpy-sources.json \
              --fenics-package-lock locks/linux/linux-x86_64-fenics-package-lock.json \
              --base-runtime out/linux-x64/numpy \
              --base-archive "$NUMPY_BASE_ARCHIVE" \
              --base-qualification dist/qualification-linux-x64-numpy-base.json \
              --wheel-dir "$FENICS_PYTHON_BUILDER_WHEELS" \
              --output-dir "$builder" \
              --manifest "$builder/manifest.json" \
            | tee "$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype/python-builder-prepare.log"
          test -f "$builder/manifest.json"
          echo "FENICS_PYTHON_BUILDER_MANIFEST=$builder/manifest.json" >> "$GITHUB_ENV"

      - name: Replay and prepare pinned libxml2 build dependencies without solving
        shell: bash
        run: |
          set -euo pipefail
          lock=locks/linux/linux-x86_64-fenics-libxml2-build-deps.json
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          transaction="$prototype/libxml2-build-deps-explicit.txt"
          dev_prefix="$RUNNER_TEMP/linux-fenics-libxml2-devel"
          prepared="$prototype/libxml2-build-deps"
          rm -rf "$dev_prefix" "$prepared"

          python3 scripts/linux/prepare_fenics_libxml2_build_deps.py explicit \
            --lock "$lock" \
            --fenics-package-lock "$FENICS_LOCK_FILE" \
            --output "$transaction" \
            | tee "$prototype/libxml2-build-deps-explicit.log"
          grep -Fx 'dependency_solver=disabled' "$prototype/libxml2-build-deps-explicit.log"

          # This is an exact two-record @EXPLICIT URL+SHA256 replay. No channel,
          # repodata or dependency solve participates in the development prefix.
          CONDA_SUBDIR=linux-64 "$MAMBA_EXE" create -y \
            -p "$dev_prefix" \
            --file "$transaction" \
            2>&1 | tee "$prototype/libxml2-build-deps-replay.log"

          python3 scripts/linux/prepare_fenics_libxml2_build_deps.py prepare \
            --lock "$lock" \
            --fenics-package-lock "$FENICS_LOCK_FILE" \
            --fenics-prefix-evidence "$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
            --fenics-prefix "$FENICS_LOCKED_PREFIX" \
            --development-prefix "$dev_prefix" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --output-dir "$prepared" \
            --manifest "$prepared/manifest.json" \
            | tee "$prototype/libxml2-build-deps-prepare.log"
          python3 - "$prepared/manifest.json" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["production_frozen"] is True
          assert data["policy"]["dependency_solver_used"] is False
          assert data["policy"]["index_access"] is False
          assert data["policy"]["network_access_after_replay"] is False
          assert data["input_evidence"]["dependency_solver_used"] is False
          assert data["tree"]["file_count"] == 19
          assert len(data["headers"]) == 17
          assert [item["name"] for item in data["source_packages"]["development"]] == ["zlib", "liblzma-devel"]
          assert [item["name"] for item in data["source_packages"]["runtime"]] == ["libzlib", "liblzma"]
          print(f"libxml2_build_deps_tree_sha256={data['tree']['tree_sha256']}")
          PY
          echo "FENICS_LIBXML2_BUILD_DEPS_MANIFEST=$prepared/manifest.json" >> "$GITHUB_ENV"

      - name: Replay and verify pinned 41-record native build-tool lock
        shell: bash
        run: |
          set -euo pipefail
          explicit=locks/linux/linux-x86_64-fenics-build-tools-explicit.txt
          prefix="$RUNNER_TEMP/linux-fenics-build-tools"
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          rm -rf "$prefix"
          CONDA_SUBDIR=linux-64 "$MAMBA_EXE" create -y \
            -p "$prefix" \
            --file "$explicit" \
            2>&1 | tee "$prototype/build-tool-replay.log"
          python3 scripts/linux/verify_fenics_build_tools.py \
            --explicit "$explicit" \
            --source-prefix "$prefix" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --evidence "$prototype/build-tool-verification.json" \
            --exact-prefix \
            | tee "$prototype/build-tool-verification.log"
          echo "FENICS_BUILD_TOOL_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Exercise pinned C++20 build toolchain offline on glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          cat > "$prototype/cxx20-smoke.cpp" <<'CPP'
          #include <concepts>
          template <std::integral T> constexpr T twice(T value) { return value + value; }
          static_assert(twice(21) == 42);
          CPP
          docker run --rm --network none \
            --env "FENICS_BUILD_TOOL_PREFIX=$FENICS_BUILD_TOOL_PREFIX" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              "$FENICS_BUILD_TOOL_PREFIX/bin/x86_64-conda-linux-gnu-g++" \
                -std=c++20 -Werror -c \
                /workspace/build/linux-fenics-overlay/native-rebuild-prototype/cxx20-smoke.cpp \
                -o /workspace/build/linux-fenics-overlay/native-rebuild-prototype/cxx20-smoke.o
            '
          sha256sum \
            "$prototype/cxx20-smoke.cpp" \
            "$prototype/cxx20-smoke.o" \
            "$FENICS_BUILD_TOOL_PREFIX/bin/x86_64-conda-linux-gnu-g++" \
            > "$prototype/cxx20-smoke.sha256"

      - name: Probe HDF5 curl PSL ICU edge offline on glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          scratch="$RUNNER_TEMP/linux-fenics-icu-edge-probe"
          rm -rf "$scratch"
          docker run --rm --network none \
            --env "FENICS_ICU_EDGE_INPUT_DIR=$FENICS_ICU_EDGE_INPUT_DIR" \
            --env "FENICS_LOCKED_PREFIX=$FENICS_LOCKED_PREFIX" \
            --env "FENICS_BUILD_TOOL_PREFIX=$FENICS_BUILD_TOOL_PREFIX" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /opt/python/cp314-cp314/bin/python3 scripts/linux/probe_fenics_icu_edge.py probe \
              --contract /workspace/locks/linux/linux-x86_64-fenics-icu-edge-probe.json \
              --input-dir "$FENICS_ICU_EDGE_INPUT_DIR" \
              --runtime-lock /workspace/locks/linux/linux-x86_64-fenics-package-lock.json \
              --locked-prefix "$FENICS_LOCKED_PREFIX" \
              --build-tool-prefix "$FENICS_BUILD_TOOL_PREFIX" \
              --base-provenance /workspace/out/linux-x64/numpy/build-provenance-linux.json \
              --prefix-verification /workspace/build/linux-fenics-overlay/package-lock-verification.json \
              --build-tool-verification /workspace/build/linux-fenics-overlay/native-rebuild-prototype/build-tool-verification.json \
              --stock-abi-preflight /workspace/build/linux-fenics-overlay/stock-native-abi-preflight.json \
              --scratch-root "$scratch" \
              --evidence /workspace/build/linux-fenics-overlay/native-rebuild-prototype/icu-edge-probe.json \
            2>&1 | tee "$prototype/icu-edge-probe.log"
          python3 - "$prototype/icu-edge-probe.json" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["status"] == "pass-experimental-closure-only"
          assert data["release_eligible"] is False
          assert data["hosted_container"] == {
              "architecture": "x86_64",
              "glibc": "glibc 2.17",
              "non_loopback_default_routes": [],
          }
          assert data["runtime_lock"]["record_count"] == 124
          assert data["dt_needed_delta"]["added"] == []
          assert data["dt_needed_delta"]["removed"] and all(
              item.startswith("libpsl.so") for item in data["dt_needed_delta"]["removed"]
          )
          candidate_names = data["candidate_libcurl_closure"]["reached_names"]
          control_names = data["mpich_icu_control"]["reached_names"]
          assert not any(name.startswith(("libpsl.so", "libicu")) for name in candidate_names)
          assert any(name.startswith("libicuuc.so") for name in control_names)
          assert "disabled" in data["capability_impact"]["libcurl_public_suffix_list"]
          print("hosted_icu_edge_probe_contract=pass")
          PY

      - name: Validate hosted native rebuild public-input skeleton
        shell: bash
        run: |
          set -euo pipefail
          scratch="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype/rebuild"
          rm -rf "$scratch"
          python3 scripts/linux/rebuild_fenics_native.py \
            --source-manifest locks/linux/linux-x86_64-fenics-rebuild-sources.json \
            --source-dir "$FENICS_REBUILD_SOURCE_DIR" \
            --package-lock "$FENICS_LOCK_FILE" \
            --source-explicit "$FENICS_SOURCE_EXPLICIT" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --locked-prefix "$FENICS_LOCKED_PREFIX" \
            --build-tool-explicit locks/linux/linux-x86_64-fenics-build-tools-explicit.txt \
            --build-tool-prefix "$FENICS_BUILD_TOOL_PREFIX" \
            --build-tool-package-cache "$FENICS_PACKAGE_CACHE" \
            --python-builder-manifest "$FENICS_PYTHON_BUILDER_MANIFEST" \
            --libxml2-build-deps-manifest "$FENICS_LIBXML2_BUILD_DEPS_MANIFEST" \
            --stock-abi-preflight "$FENICS_STOCK_ABI_PREFLIGHT" \
            --scratch-root "$scratch" \
            --validate-public-inputs-only \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype/public-input-validation.log"
          test -f "$scratch/evidence/native-rebuild-provenance.json"
          python3 - "$scratch/evidence/native-rebuild-provenance.json" <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["status"] == "validated-input-skeleton"
          assert data["source_rebuild_provenance_eligible"] is False
          assert data["outputs"]["public_input_validation_only"] is True
          assert data["inputs"]["deferred_full_rebuild_inputs"] == [
              "private_provider_manifest",
              "native_closure_report",
          ]
          print("hosted_public_input_skeleton=pass")
          PY

      - name: Reproduce pinned private C++ runtime provider on glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          provider="$prototype/cxx-provider"
          mkdir -p "$provider"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$MAMBA_ROOT_PREFIX:$MAMBA_ROOT_PREFIX" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              /workspace/out/linux-x64/numpy/bin/python3.14 \
                scripts/linux/build_fenics_cxx_provider.py \
                --runtime-prefix "$1" \
                --runtime-prefix-evidence "$2" \
                --package-cache "$3" \
                --output-dir /workspace/build/linux-fenics-overlay/native-rebuild-prototype/cxx-provider \
                --manifest /workspace/build/linux-fenics-overlay/native-rebuild-prototype/cxx-provider/provider-manifest.json
            ' -- \
              "$FENICS_LOCKED_PREFIX" \
              "/workspace/$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
              "$FENICS_PACKAGE_CACHE" \
            2>&1 | tee "$provider/reproduction.log"
          test -f "$provider/provider-manifest.json"
          sha256sum "$provider/libfenics_cxxrt.so.1" \
            "$provider/provider-manifest.json" \
            > "$provider/reproduction.sha256"

      - name: Build exact selective native candidate offline on glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          scratch="$prototype/rebuild-candidate"
          rm -rf "$scratch"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
            --volume "$MAMBA_ROOT_PREFIX:$MAMBA_ROOT_PREFIX:ro" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(uname -m)" = x86_64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              exec /opt/python/cp314-cp314/bin/python scripts/linux/rebuild_fenics_native.py \
                --source-manifest locks/linux/linux-x86_64-fenics-rebuild-sources.json \
                --source-dir "$1" \
                --package-lock locks/linux/linux-x86_64-fenics-package-lock.json \
                --source-explicit locks/linux/linux-x86_64-fenics-explicit.txt \
                --package-cache "$2" \
                --locked-prefix "$3" \
                --build-tool-explicit locks/linux/linux-x86_64-fenics-build-tools-explicit.txt \
                --build-tool-prefix "$4" \
                --build-tool-package-cache "$2" \
                --python-builder-manifest "/workspace/$5" \
                --libxml2-build-deps-manifest "/workspace/$6" \
                --private-provider-manifest /workspace/build/linux-fenics-overlay/native-rebuild-prototype/cxx-provider/provider-manifest.json \
                --stock-abi-preflight /workspace/build/linux-fenics-overlay/stock-native-abi-preflight.json \
                --scratch-root /workspace/build/linux-fenics-overlay/native-rebuild-prototype/rebuild-candidate \
                --execute
            ' -- \
              "$FENICS_REBUILD_SOURCE_DIR" \
              "$FENICS_PACKAGE_CACHE" \
              "$FENICS_LOCKED_PREFIX" \
              "$FENICS_BUILD_TOOL_PREFIX" \
              "$FENICS_PYTHON_BUILDER_MANIFEST" \
              "$FENICS_LIBXML2_BUILD_DEPS_MANIFEST" \
            2>&1 | tee "$prototype/native-rebuild-candidate.log"

          handoff="$scratch/evidence/native-build-handoff.json"
          test -f "$handoff"
          python3 - "$handoff" <<'PY'
          import json
          import pathlib
          import re
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data["format_version"] == 2
          assert data["kind"] == "linux-fenics-native-build-candidate-handoff"
          assert data["status"] == "candidate-built-unqualified"
          assert data["source_rebuild_provenance_eligible"] is False
          assert re.fullmatch(r"[0-9a-f]{64}", data["candidate_output_binding_sha256"])
          build_configuration = data["inputs"]["dolfinx_build_configuration"]
          assert build_configuration["flags"] == {
              "DOLFINX_ENABLE_ADIOS2": "OFF",
              "DOLFINX_ENABLE_KAHIP": "OFF",
          }
          assert re.fullmatch(r"[0-9a-f]{64}", build_configuration["cmake_cache"]["sha256"])
          assert data["qualification"] == {
              "full_native_closure": "not-run",
              "hosted_linux_glibc217": "not-run",
              "jit": "not-run",
              "poisson": "not-run",
              "relocation": "not-run",
          }
          print(f"candidate_output_binding_sha256={data['candidate_output_binding_sha256']}")
          PY
          sha256sum "$handoff" > "$prototype/native-build-handoff.sha256"
          echo "FENICS_NATIVE_BUILD_HANDOFF=$handoff" >> "$GITHUB_ENV"

      - name: Record cp314 stable-ABI package boundary
        shell: bash
        run: |
          set -euo pipefail
          prototype="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype"
          python3 - \
            "$FENICS_LOCKED_PREFIX" \
            "$FENICS_NATIVE_BUILD_HANDOFF" \
            "$FENICS_LOCK_FILE" \
            "$prototype/cp314-stable-abi-boundary.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          prefix = pathlib.Path(sys.argv[1])
          handoff_path = pathlib.Path(sys.argv[2])
          lock_path = pathlib.Path(sys.argv[3])
          output = pathlib.Path(sys.argv[4])
          handoff = json.loads(handoff_path.read_text(encoding="utf-8"))
          replacement_owners = {
              str(item["owner"])
              for item in handoff["candidate_output_binding"]["replacements"]
              if item.get("owner") != "fenics-private-cxx-runtime"
          }
          excluded = {
              "_python_abi3_support", "libpython-static", "numpy", "pip", "python",
              "python-gil", "python_abi", "setuptools", "wheel",
          }
          unresolved = []
          for metadata_path in sorted((prefix / "conda-meta").glob("*.json")):
              record = json.loads(metadata_path.read_text(encoding="utf-8"))
              name = str(record.get("name", ""))
              if not name or name in excluded or name in replacement_owners:
                  continue
              paths = record.get("paths_data", {}).get("paths")
              if isinstance(paths, list) and paths:
                  owned = [str(item.get("_path", "")) for item in paths if isinstance(item, dict)]
              else:
                  owned = [str(item) for item in record.get("files", [])]
              legacy_python_paths = sorted(
                  path
                  for path in owned
                  if path.startswith(("lib/python3.11/site-packages/", "lib/python3.12/site-packages/"))
              )
              if not legacy_python_paths:
                  continue
              unresolved.append({
                  "name": name,
                  "version": record.get("version"),
                  "build": record.get("build"),
                  "legacy_python_path_count": len(legacy_python_paths),
              })

          payload = {
              "format_version": 1,
              "target": {"python_version": "3.14.10", "python_abi": "cp314"},
              "locked_prefix_python_abi": "cp314",
              "runtime_lock_sha256": hashlib.sha256(lock_path.read_bytes()).hexdigest(),
              "candidate_handoff_sha256": hashlib.sha256(handoff_path.read_bytes()).hexdigest(),
              "candidate_replacement_owners": sorted(replacement_owners),
              "unresolved_legacy_python_site_packages": unresolved,
              "stable_abi_relocation_verified": not unresolved,
          }
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          if unresolved:
              raise SystemExit(f"cp314 replay retained legacy Python site paths: {unresolved}")
          PY

      - name: Audit and finalize exact native candidate on glibc 2.17
        shell: bash
        run: |
          set -euo pipefail
          scratch="$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype/rebuild-candidate"
          closure="$scratch/evidence/native-closure.json"
          final_handoff="$scratch/evidence/package-handoff/native-rebuild-handoff.json"
          rm -f "$closure"
          rm -rf "$(dirname "$final_handoff")"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(uname -m)" = x86_64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              /opt/python/cp314-cp314/bin/python scripts/linux/audit_fenics_native_candidate.py \
                --candidate-build-handoff "$1" \
                --output "$2" \
                --readelf "$3"
              /opt/python/cp314-cp314/bin/python scripts/linux/finalize_fenics_native.py \
                --candidate-build-handoff "$1" \
                --native-closure-report "$2" \
                --output "$4"
            ' -- \
              "/workspace/$FENICS_NATIVE_BUILD_HANDOFF" \
              "/workspace/$closure" \
              "$FENICS_BUILD_TOOL_PREFIX/bin/x86_64-conda-linux-gnu-readelf" \
              "/workspace/$final_handoff" \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/native-rebuild-prototype/native-candidate-audit.log"
          test -f "$closure"
          test -f "$final_handoff"
          sha256sum "$closure" "$final_handoff" \
            > "$scratch/evidence/native-candidate-finalization.sha256"
          echo "FENICS_NATIVE_CLOSURE_REPORT=$closure" >> "$GITHUB_ENV"
          echo "FENICS_NATIVE_REBUILD_HANDOFF=$final_handoff" >> "$GITHUB_ENV"

      - name: Package independently qualified native candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/linux/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --prefix-evidence "$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --lock "$FENICS_LOCK_FILE" \
            --base-runtime out/linux-x64/numpy \
            --base-qualification dist/qualification-linux-x64-numpy-base.json \
            --base-producer-revision "$NUMPY_BASE_REVISION" \
            --abi-preflight-evidence "$FENICS_STOCK_ABI_PREFLIGHT" \
            --native-rebuild-handoff "$FENICS_NATIVE_REBUILD_HANDOFF" \
            --output dist \
            --version 0.1.0 \
            --producer-revision "$PRODUCER_REVISION" \
            | tee "$FENICS_OVERLAY_EVIDENCE/package-qualified-candidate.log"
          test -f "dist/$OVERLAY_ASSET"

      - name: Qualify overlay offline inside pinned glibc 2.17 container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env PATH=/opt/python/cp314-cp314/bin:/usr/local/bin:/usr/bin:/bin \
            --env "OVERLAY_ASSET=$OVERLAY_ASSET" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$MANYLINUX_IMAGE" \
            /bin/bash -c '
              set -euo pipefail
              test "$(uname -m)" = x86_64
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.17"
              python3 --version
              exec bash scripts/linux/test-fenics-overlay.sh \
                --archive "/workspace/dist/$OVERLAY_ASSET" \
                --base-runtime /workspace/out/linux-x64/numpy \
                --base-qualification /workspace/dist/qualification-linux-x64-numpy-base.json \
                --evidence /workspace/build/linux-fenics-overlay/standalone-overlay-qualification.json
            ' 2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/public-base-overlay-test.log"

      - name: Repackage overlay and prove deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-repeat
          python3 scripts/linux/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --prefix-evidence "$FENICS_OVERLAY_EVIDENCE/package-lock-verification.json" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --lock "$FENICS_LOCK_FILE" \
            --base-runtime out/linux-x64/numpy \
            --base-qualification dist/qualification-linux-x64-numpy-base.json \
            --base-producer-revision "$NUMPY_BASE_REVISION" \
            --abi-preflight-evidence "$FENICS_STOCK_ABI_PREFLIGHT" \
            --native-rebuild-handoff "$FENICS_NATIVE_REBUILD_HANDOFF" \
            --output dist-repeat \
            --version 0.1.0 \
            --producer-revision "$PRODUCER_REVISION" \
            > "$FENICS_OVERLAY_EVIDENCE/package-overlay-repeat.log"
          cmp "dist/$OVERLAY_ASSET" "dist-repeat/$OVERLAY_ASSET"
          cmp "dist/$OVERLAY_ASSET.json" "dist-repeat/$OVERLAY_ASSET.json"
          cmp "dist/$OVERLAY_ASSET.sha256" "dist-repeat/$OVERLAY_ASSET.sha256"
          echo 'deterministic_overlay_rebuild=pass' \
            > "$FENICS_OVERLAY_EVIDENCE/deterministic-rebuild.txt"

      - name: Collect immutable Linux FEniCS evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$FENICS_OVERLAY_EVIDENCE"
          cp ci-artifact/manylinux-identity.txt "$evidence/"
          cp ci-artifact/manylinux-image-inspect.json "$evidence/"
          cp dist/qualification-linux-x64-numpy-base.json "$evidence/numpy-base-qualification.json"
          cp out/linux-x64/numpy/runtime-manifest.json "$evidence/numpy-base-runtime-manifest.json"
          cp out/linux-x64/numpy/build-provenance-linux.json "$evidence/numpy-base-core-provenance.json"
          cp out/linux-x64/numpy/build-provenance-linux-numpy.json "$evidence/numpy-base-build-provenance.json"
          cp out/linux-x64/numpy/numpy-payload-manifest-linux.json "$evidence/numpy-base-payload-manifest.json"
          cp locks/core/fenics-numpy-base-release.json "$evidence/numpy-base-release-lock.json"
          cp locks/linux/linux-x86_64-fenics-package-lock.json "$evidence/"
          cp locks/linux/linux-x86_64-fenics-explicit.txt "$evidence/"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-embed-manifest.json \
            > "$evidence/fenics-embed-manifest.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/package-provenance.json \
            > "$evidence/package-provenance.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/source-provenance.json \
            > "$evidence/source-provenance.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/native-dependency-census.json \
            > "$evidence/native-dependency-census.json"
          tar -xOf "dist/$OVERLAY_ASSET" fenics-runtime/provenance/license-inventory.json \
            > "$evidence/license-inventory.json"
          cp "dist/$OVERLAY_ASSET.json" "$evidence/"
          cp "dist/$OVERLAY_ASSET.sha256" "$evidence/"
          sha256sum \
            "$evidence/fenics-embed-manifest.json" \
            "$evidence/package-provenance.json" \
            "$evidence/source-provenance.json" \
            "$evidence/native-dependency-census.json" \
            "$evidence/stock-native-abi-preflight.json" \
            "$FENICS_NATIVE_CLOSURE_REPORT" \
            "$FENICS_NATIVE_REBUILD_HANDOFF" \
            "$evidence/license-inventory.json" \
            "$evidence/package-lock-verification.json" \
            "$evidence/numpy-base-qualification.json" \
            "$evidence/numpy-base-runtime-manifest.json" \
            "$evidence/numpy-base-core-provenance.json" \
            "$evidence/numpy-base-build-provenance.json" \
            "$evidence/numpy-base-payload-manifest.json" \
            "$evidence/numpy-base-release-lock.json" \
            "$evidence/linux-x86_64-fenics-package-lock.json" \
            "$evidence/linux-x86_64-fenics-explicit.txt" \
            "$evidence/manylinux-identity.txt" \
            > "$evidence/overlay-evidence-sha256.txt"

      - name: Write Linux FEniCS producer qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/common/write_qualification.py \
            --platform linux-x64 \
            --profile fenics \
            --artifact "dist/$OVERLAY_ASSET" \
            --output "$FENICS_OVERLAY_EVIDENCE/qualification-linux-x64-fenics.json" \
            --check pinned_manylinux=pass \
            --check glibc_floor=pass \
            --check package_lock_replay=pass \
            --check package_hash_verification=pass \
            --check dependency_solver_disabled=pass \
            --check stock_package_reuse=pass \
            --check public_numpy_base=pass \
            --check inherited_numpy_identity=pass \
            --check producer_python_excluded=pass \
            --check producer_numpy_excluded=pass \
            --check hostile_ambient_state=pass \
            --check relocation=pass \
            --check fresh_ffcx_jit=pass \
            --check serial_petsc_poisson=pass \
            --check mpich_provider=pass \
            --check native_closure=pass \
            --check native_symbol_ceilings=pass \
            --check deterministic_archive=pass \
            --check private_consumer_checkout=not-applicable
          sha256sum \
            "dist/$OVERLAY_ASSET" \
            "dist/$OVERLAY_ASSET.json" \
            "$FENICS_OVERLAY_EVIDENCE/qualification-linux-x64-fenics.json" \
            "$FENICS_OVERLAY_EVIDENCE/fenics-embed-manifest.json" \
            "$FENICS_OVERLAY_EVIDENCE/package-provenance.json" \
            "$FENICS_OVERLAY_EVIDENCE/source-provenance.json" \
            "$FENICS_OVERLAY_EVIDENCE/native-dependency-census.json" \
            "$FENICS_OVERLAY_EVIDENCE/stock-native-abi-preflight.json" \
            "$FENICS_OVERLAY_EVIDENCE/license-inventory.json" \
            > "$FENICS_OVERLAY_EVIDENCE/SHA256SUMS-linux-fenics.txt"

      - name: Upload qualified Linux FEniCS overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fenics-embed-runtime-linux-x64-cp314
          path: |
            dist/fenics-embed-runtime-v0.1.0-linux-x64-cp314.tar.gz
            dist/fenics-embed-runtime-v0.1.0-linux-x64-cp314.tar.gz.json
            dist/fenics-embed-runtime-v0.1.0-linux-x64-cp314.tar.gz.sha256
            build/linux-fenics-overlay/
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p ci-artifact/fenics-failure
          cp -R build/linux-fenics-overlay ci-artifact/fenics-failure/ 2>/dev/null || true
          find out/linux-x64/numpy build/linux-fenics-overlay -maxdepth 5 \
            \( -type f -o -type l \) -print 2>/dev/null | sort \
            > ci-artifact/fenics-failure/tree.txt
          while IFS= read -r log; do
            echo "===== $log ====="
            tail -n 250 "$log"
          done < <(find ci-artifact build/linux-fenics-overlay -type f -name '*.log' -print 2>/dev/null | sort)

      - name: Upload Linux FEniCS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualify-linux-fenics-diagnostics-${{ github.run_id }}
          path: ci-artifact/
          if-no-files-found: warn
          retention-days: 1
