name: qualify-macos-fenics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-macos-fenics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-overlay:
    name: qualify-macos-fenics-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            artifact_platform: macos-arm64
            artifact_arch: arm64
            conda_subdir: osx-arm64
            overlay_asset: fenics-embed-runtime-v0.1.0-macos-arm64-cp314.zip
          - architecture: x86_64
            runner: macos-15
            artifact_platform: macos-x64
            artifact_arch: x64
            conda_subdir: osx-64
            overlay_asset: fenics-embed-runtime-v0.1.0-macos-x64-cp314.zip
    env:
      TARGET_ARCH: ${{ matrix.architecture }}
      ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      TARGET_SUBDIR: ${{ matrix.conda_subdir }}
      OVERLAY_ASSET: ${{ matrix.overlay_asset }}
      NUMPY_BASE_TAG: runtime-v0.1.0-rc1
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Capture checked-out producer revision
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCER_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Provision Rosetta for x86_64 target
        if: ${{ matrix.architecture == 'x86_64' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sudo softwareupdate --install-rosetta --agree-to-license >"$RUNNER_TEMP/rosetta-install.log" 2>&1 || {
            cat "$RUNNER_TEMP/rosetta-install.log" >&2
            /usr/bin/arch -x86_64 /usr/bin/uname -m >/dev/null 2>&1 || exit 1
          }
          test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = x86_64

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ARCH" == x86_64 ]]; then
            test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = x86_64
          else
            test "$(uname -m)" = arm64
          fi

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          # setup-micromamba requires the release tag form; this tag installs
          # micromamba/libmamba 2.10.0, matching prototype run 41294435601.
          micromamba-version: '2.10.0-0'

      - name: Replay immutable package lock without solving
        shell: bash
        run: |
          set -euo pipefail
          lock="locks/macos/macos-${TARGET_ARCH}-package-lock.json"
          source_explicit="locks/macos/macos-${TARGET_ARCH}-explicit.txt"
          explicit="$RUNNER_TEMP/fenics-macos-${TARGET_ARCH}-explicit.txt"
          prefix="$RUNNER_TEMP/fenics-macos-locked-${TARGET_ARCH}"
          package_cache="$MAMBA_ROOT_PREFIX/pkgs"
          evidence="build/macos-overlay-${TARGET_ARCH}"
          mkdir -p "$evidence"
          rm -rf "$prefix"

          # The old cp312 lock must never be combined with the cp314 NumPy
          # base. This gate remains closed until a fully SHA-pinned cp314
          # FEniCS transaction has been independently qualified.
          python3 - "$lock" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          packages = json.loads(path.read_text(encoding="utf-8"))["packages"]
          by_name = {record["name"]: record for record in packages}
          python = by_name.get("python", {})
          abi = by_name.get("python_abi", {})
          if python.get("version") != "3.14.10" or abi.get("version") != "3.14" or "cp314" not in abi.get("build", ""):
              raise SystemExit(
                  f"FEniCS lock is not compatible with qualified cp314 base: {path}; "
                  "refresh and qualify the immutable native/Python package transaction first"
              )
          for name in ("cpython", "libpython", "python-gil"):
              record = by_name.get(name)
              if record is not None and record.get("version") != "3.14.10":
                  raise SystemExit(f"FEniCS lock contains incompatible {name}: {record['version']}")
          for record in packages:
              if "cp312" in record["build"] or "cp312" in record["url"] or "py312" in record["build"]:
                  raise SystemExit(f"legacy CPython ABI package in FEniCS lock: {record['name']}")
          PY

          {
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            echo "runner_arch=$(uname -m)"
            sw_vers
            xcodebuild -version
            clang --version
            xcrun --show-sdk-path
            xcrun --show-sdk-version
          } > "$evidence/host-toolchain.txt"

          python3 scripts/macos/package_lock.py explicit \
            --lock "$lock" \
            --source-explicit "$source_explicit" \
            --arch "$TARGET_ARCH" \
            --output "$explicit" \
            | tee "$evidence/package-lock-render.log"
          cp "$explicit" "$evidence/locked-explicit.txt"

          # @EXPLICIT contains exact package URLs + SHA-256 fragments.  No
          # channel, matchspec or dependency solve participates here.
          CONDA_SUBDIR="$TARGET_SUBDIR" "$MAMBA_EXE" create -y \
            -p "$prefix" \
            --file "$explicit" \
            2>&1 | tee "$evidence/package-lock-replay.log"

          python3 scripts/macos/package_lock.py verify-prefix \
            --lock "$lock" \
            --arch "$TARGET_ARCH" \
            --prefix "$prefix" \
            --package-cache "$package_cache" \
            --evidence "$evidence/package-lock-verification.json" \
            | tee "$evidence/package-lock-verification.log"

          echo "FENICS_LOCK_FILE=$lock" >> "$GITHUB_ENV"
          echo "FENICS_LOCKED_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FENICS_PACKAGE_CACHE=$package_cache" >> "$GITHUB_ENV"
          echo "FENICS_OVERLAY_EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Restore immutable qualified NumPy base runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          base_runtime="out/macos-$TARGET_ARCH/numpy"
          base_qualification="dist/qualification-macos-$ARTIFACT_ARCH-numpy-base.json"
          base_archive="dist/python-runtime-v0.1.0-macos-$ARTIFACT_ARCH-cp314-numpy.zip"
          python3 scripts/common/restore_qualified_numpy_base.py \
            --tag "$NUMPY_BASE_TAG" \
            --platform "$ARTIFACT_PLATFORM" \
            --output "$base_runtime" \
            --qualification-output "$base_qualification" \
            --archive-output "$base_archive"
          python3 scripts/macos/verify-runtime-evidence.py \
            --runtime "$base_runtime" --profile numpy --arch "$TARGET_ARCH"
          python3 - locks/core/fenics-numpy-base-release.json \
            "$base_runtime/runtime-manifest.json" "$base_qualification" "$NUMPY_BASE_TAG" <<'PY'
          import json
          import os
          import pathlib
          import sys

          pin_path = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])
          qualification_path = pathlib.Path(sys.argv[3])
          expected_tag = sys.argv[4]
          pin = json.loads(pin_path.read_text(encoding="utf-8-sig"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
          qualification = json.loads(qualification_path.read_text(encoding="utf-8-sig"))
          if pin.get("repository") != "precsim/python-numpy-fenics" or pin.get("tag") != expected_tag:
              raise SystemExit(f"NumPy base release pin does not match requested release: {pin_path}")
          expected_revision = pin.get("producer_revision")
          manifest_revision = manifest.get("producer", {}).get("revision")
          qualification_revision = qualification.get("producer_revision")
          if manifest_revision != expected_revision or qualification_revision != expected_revision:
              raise SystemExit(
                  "restored NumPy base revision mismatch: "
                  f"manifest={manifest_revision!r} qualification={qualification_revision!r} "
                  f"expected={expected_revision!r}"
              )
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"NUMPY_BASE_REVISION={expected_revision}\n")
          print(f"numpy_base_revision={expected_revision}")
          PY

      - name: Prove fresh FFCx JIT and serial PETSc solve from locked packages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/macos/test-conda-clang-jit.sh
          scripts/macos/test-conda-clang-jit.sh \
            "$FENICS_LOCKED_PREFIX" \
            "$TARGET_ARCH"
          source_evidence="$RUNNER_TEMP/fenics macos clang prototype $TARGET_ARCH/evidence"
          test -d "$source_evidence"
          cp -R "$source_evidence" "$FENICS_OVERLAY_EVIDENCE/jit-evidence"

      - name: Package relocatable macOS overlay
        shell: bash
        run: |
          set -euo pipefail
          producer_revision="$(git rev-parse HEAD)"
          mkdir -p dist
          python3 scripts/macos/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --lock "$FENICS_LOCK_FILE" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --base-runtime "out/macos-$TARGET_ARCH/numpy" \
            --arch "$TARGET_ARCH" \
            --output dist \
            --version 0.1.0 \
            --base-producer-revision "$NUMPY_BASE_REVISION" \
            --producer-revision "$producer_revision" \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/package-overlay.log"
          test -f "dist/$OVERLAY_ASSET"
          test -f "dist/$OVERLAY_ASSET.json"
          test -f "dist/$OVERLAY_ASSET.sha256"

      - name: Qualify exact overlay on public NumPy base runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/macos/test-fenics-overlay.sh
          scripts/macos/test-fenics-overlay.sh \
            --zip "dist/$OVERLAY_ASSET" \
            --base-runtime "out/macos-$TARGET_ARCH/numpy" \
            --arch "$TARGET_ARCH" \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/public-base-overlay-test.log"

      - name: Rebuild overlay and prove deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          producer_revision="$(git rev-parse HEAD)"
          mkdir -p dist-repeat
          python3 scripts/macos/package_fenics_overlay.py \
            --prefix "$FENICS_LOCKED_PREFIX" \
            --lock "$FENICS_LOCK_FILE" \
            --package-cache "$FENICS_PACKAGE_CACHE" \
            --base-runtime "out/macos-$TARGET_ARCH/numpy" \
            --arch "$TARGET_ARCH" \
            --output dist-repeat \
            --version 0.1.0 \
            --base-producer-revision "$NUMPY_BASE_REVISION" \
            --producer-revision "$producer_revision" \
            > "$FENICS_OVERLAY_EVIDENCE/package-overlay-repeat.log"
          cmp "dist/$OVERLAY_ASSET" "dist-repeat/$OVERLAY_ASSET"
          cmp "dist/$OVERLAY_ASSET.json" "dist-repeat/$OVERLAY_ASSET.json"
          cmp "dist/$OVERLAY_ASSET.sha256" "dist-repeat/$OVERLAY_ASSET.sha256"
          echo "deterministic_overlay_rebuild=pass" \
            > "$FENICS_OVERLAY_EVIDENCE/deterministic-rebuild.txt"

      - name: Audit packaged ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/fenics overlay audit $TARGET_ARCH"
          rm -rf "$audit_root"
          mkdir -p "$audit_root"
          unzip -t "dist/$OVERLAY_ASSET" \
            | tee "$FENICS_OVERLAY_EVIDENCE/zip-integrity.log"
          ditto -x -k "dist/$OVERLAY_ASSET" "$audit_root"
          python3 -m py_compile \
            "$audit_root/Python.framework/Versions/3.14/lib/python3.14/site-packages/fenics_embed_runtime.py"
          if [[ "$TARGET_ARCH" == arm64 ]]; then
            clang_name=arm64-apple-darwin20.0.0-clang
            linker_name=arm64-apple-darwin20.0.0-ld
          else
            clang_name=x86_64-apple-darwin13.4.0-clang
            linker_name=x86_64-apple-darwin13.4.0-ld
          fi
          test -x "$audit_root/fenics-runtime/conda/bin/$clang_name"
          test -x "$audit_root/fenics-runtime/conda/bin/$linker_name"
          if find "$audit_root" -type f -o -type l | sed "s#^$audit_root/##" \
              | grep -E '^fenics-runtime/conda/lib/python3\.14/site-packages/(numpy/|numpy\.libs/|numpy-[^/]+\.dist-info/)'; then
            echo "producer-owned NumPy path found in overlay" >&2
            exit 1
          fi
          python3 - "dist/$OVERLAY_ASSET" "dist/$OVERLAY_ASSET.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          summary = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if summary.get("artifact") != archive.name or summary.get("sha256") != actual:
              raise SystemExit("outer summary does not bind the packaged ZIP")
          print(f"overlay_sha256={actual}")
          print("packaged_zip_structure=pass")
          PY

      - name: Remove producer source environments after packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$FENICS_LOCKED_PREFIX" "$FENICS_PACKAGE_CACHE"
          test ! -e "$FENICS_LOCKED_PREFIX"
          test ! -e "$FENICS_PACKAGE_CACHE"

      - name: Collect immutable handoff evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "dist/$OVERLAY_ASSET" "$FENICS_OVERLAY_EVIDENCE/"
          cp "dist/$OVERLAY_ASSET.json" "$FENICS_OVERLAY_EVIDENCE/"
          cp "dist/$OVERLAY_ASSET.sha256" "$FENICS_OVERLAY_EVIDENCE/"
          cp "dist/qualification-macos-$ARTIFACT_ARCH-numpy-base.json" \
            "$FENICS_OVERLAY_EVIDENCE/numpy-base-qualification.json"
          cp "out/macos-$TARGET_ARCH/numpy/runtime-manifest.json" \
            "$FENICS_OVERLAY_EVIDENCE/numpy-base-runtime-manifest.json"
          unzip -p "dist/$OVERLAY_ASSET" fenics-embed-manifest.json \
            > "$FENICS_OVERLAY_EVIDENCE/fenics-embed-manifest.json"
          unzip -p "dist/$OVERLAY_ASSET" fenics-runtime/provenance/native-census.json \
            > "$FENICS_OVERLAY_EVIDENCE/native-census.json"
          unzip -p "dist/$OVERLAY_ASSET" fenics-runtime/provenance/third-party-licenses.json \
            > "$FENICS_OVERLAY_EVIDENCE/third-party-licenses.json"
          shasum -a 256 \
            "$FENICS_OVERLAY_EVIDENCE/fenics-embed-manifest.json" \
            "$FENICS_OVERLAY_EVIDENCE/native-census.json" \
            "$FENICS_OVERLAY_EVIDENCE/third-party-licenses.json" \
            > "$FENICS_OVERLAY_EVIDENCE/overlay-evidence-sha256.txt"
          python3 - "$FENICS_OVERLAY_EVIDENCE" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          output = root / "top-level-sha256.txt"
          lines = []
          for path in sorted(root.iterdir()):
              if path == output or not path.is_file():
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Write producer qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ARCH" == arm64 ]]; then
            platform=macos-arm64
          else
            platform=macos-x64
          fi
          python3 scripts/common/write_qualification.py \
            --platform "$platform" \
            --profile fenics \
            --artifact "dist/$OVERLAY_ASSET" \
            --output "$FENICS_OVERLAY_EVIDENCE/qualification-${platform}-fenics.json" \
            --check package_lock_replay=pass \
            --check package_hash_verification=pass \
            --check public_numpy_base=pass \
            --check inherited_numpy_identity=pass \
            --check producer_python_excluded=pass \
            --check producer_numpy_excluded=pass \
            --check fresh_ffcx_jit=pass \
            --check serial_petsc_solve=pass \
            --check deterministic_archive=pass \
            --check native_closure=pass \
            --check private_consumer_checkout=not-applicable

      - name: Upload macOS overlay qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fenics-macos-overlay-${{ matrix.architecture }}
          path: build/macos-overlay-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          find "build/macos-overlay-${TARGET_ARCH}" -maxdepth 3 -type f -print 2>/dev/null | sort
          while IFS= read -r log; do
            echo "===== $log ====="
            tail -n 250 "$log"
          done < <(find "build/macos-overlay-${TARGET_ARCH}" -type f -name '*.log' -print 2>/dev/null | sort)
