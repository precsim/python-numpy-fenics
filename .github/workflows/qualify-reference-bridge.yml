name: qualify-reference-bridge

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Runtime profiles to qualify
        required: true
        default: core+numpy
        type: choice
        options:
          - core
          - core+numpy
          - core+numpy+fenics
  pull_request:
    paths:
      - ".github/workflows/qualify-reference-bridge.yml"
      - "consumer-kit/**"
      - "reference-bridge/**"
      - "locks/consumer/reference-runtime-v1.json"
      - "tests/reference-bridge/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qualify-reference-bridge.yml"
      - "consumer-kit/**"
      - "reference-bridge/**"
      - "locks/consumer/reference-runtime-v1.json"
      - "tests/reference-bridge/**"

permissions:
  contents: read

concurrency:
  group: reference-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REFERENCE_RUNTIME_RECEIPT: locks/consumer/reference-runtime-v1.json
  REFERENCE_VERSION: v0.1.0-rc1
  RC2_PRODUCER_REVISION: 88f36aaa09fb8a84ea528d5823d9b0be043cfa3e
  OCTAVE_WINDOWS_VERSION: "11.3.0"
  OCTAVE_MACOS_VERSION: "11.3.0"
  OCTAVE_LINUX_VERSION: "6.4.0"
  MANYLINUX2014_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50

jobs:
  build:
    name: build-once / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned GNU Octave on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install octave --version="$env:OCTAVE_WINDOWS_VERSION" --yes --no-progress
          $octave = Get-ChildItem "C:\Program Files\GNU Octave" -Recurse -Filter octave-cli.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $octave) {
            throw "GNU Octave executable was not found after installation"
          }
          $version = (& $octave.FullName --version | Select-Object -First 1)
          if ($version -notmatch [regex]::Escape($env:OCTAVE_WINDOWS_VERSION)) {
            throw "unexpected GNU Octave version: $version"
          }
          $bin = Split-Path -Parent $octave.FullName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "REFERENCE_OCTAVE=$($octave.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned GNU Octave on Linux
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y octave=6.4.0-2 octave-dev=6.4.0-2
          test "$(octave-config -p VERSION)" = "$OCTAVE_LINUX_VERSION"

      - name: Install pinned GNU Octave on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          brew install --force-bottle octave
          test "$(octave-config -p VERSION)" = "$OCTAVE_MACOS_VERSION"

      - name: Stage and verify core build runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python consumer-kit/tools/stage-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile core --cache build/reference-cache --output "build/reference/build-core/${{ matrix.target }}/runtime" --record "build/reference/build-core/${{ matrix.target }}/runtime-receipt.json"
          python consumer-kit/tools/verify-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile core --cache build/reference-cache --runtime "build/reference/build-core/${{ matrix.target }}/runtime" --record "build/reference/build-core/${{ matrix.target }}/runtime-verify.json"

      - name: Build candidate with MSVC
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & consumer-kit/tools/build.ps1 `
            --manifest reference-bridge/bridge-build.json `
            --source-root reference-bridge `
            --runtime "build/reference/build-core/${{ matrix.target }}/runtime" `
            --output-dir "build/reference/candidate/${{ matrix.target }}" `
            --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json"

      - name: Build Linux candidate in pinned manylinux2014
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          octave_include="$(octave-config -p OCTINCLUDEDIR)"
          test -f "$octave_include/mex.h"
          mkdir -p build/octave-headers
          cp -a "$octave_include/." build/octave-headers/
          workspace="$GITHUB_WORKSPACE"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e "GITHUB_SHA=$GITHUB_SHA" \
            -e "OCTAVE_VERSION=$OCTAVE_LINUX_VERSION" \
            -e "OCTAVE_INCLUDE_DIRS=$workspace/build/octave-headers" \
            -e "PYTHON=/opt/python/cp312-cp312/bin/python" \
            -v "$workspace:$workspace" \
            -w "$workspace" \
            "$MANYLINUX2014_IMAGE" \
            bash consumer-kit/tools/build-linux.sh \
              --manifest reference-bridge/bridge-build.json \
              --source-root reference-bridge \
              --runtime "build/reference/build-core/${{ matrix.target }}/runtime" \
              --output-dir "build/reference/candidate/${{ matrix.target }}" \
              --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json"

      - name: Build macOS candidate with Clang
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          REFERENCE_BRIDGE_TARGET="${{ matrix.target }}" \
            bash consumer-kit/tools/build-macos.sh \
              --manifest reference-bridge/bridge-build.json \
              --source-root reference-bridge \
              --runtime "build/reference/build-core/${{ matrix.target }}/runtime" \
              --output-dir "build/reference/candidate/${{ matrix.target }}" \
              --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json"

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-bridge-candidate-${{ matrix.target }}
          path: build/reference/candidate/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  qualify:
    name: qualify / ${{ matrix.target }} / ${{ matrix.profile }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - win-x64
          - linux-x64
          - macos-arm64
          - macos-x64
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profiles == 'core' && '["core"]' || github.event_name == 'workflow_dispatch' && inputs.profiles == 'core+numpy+fenics' && '["core","numpy","fenics"]' || '["core","numpy"]') }}
        include:
          - target: win-x64
            runner: windows-2022
            archive_ext: zip
          - target: linux-x64
            runner: ubuntu-22.04
            archive_ext: tar.gz
          - target: macos-arm64
            runner: macos-15
            archive_ext: tar.gz
          - target: macos-x64
            runner: macos-15-intel
            archive_ext: tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up bootstrap Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download exact target candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reference-bridge-candidate-${{ matrix.target }}
          path: build/reference/candidate/${{ matrix.target }}

      - name: Install pinned GNU Octave on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install octave --version="$env:OCTAVE_WINDOWS_VERSION" --yes --no-progress
          $octave = Get-ChildItem "C:\Program Files\GNU Octave" -Recurse -Filter octave-cli.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $octave) { throw "GNU Octave executable was not found after installation" }
          $version = (& $octave.FullName --version | Select-Object -First 1)
          if ($version -notmatch [regex]::Escape($env:OCTAVE_WINDOWS_VERSION)) {
            throw "unexpected GNU Octave version: $version"
          }
          $bin = Split-Path -Parent $octave.FullName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "REFERENCE_OCTAVE=$($octave.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned GNU Octave on Linux
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y octave=6.4.0-2 octave-dev=6.4.0-2
          test "$(octave-config -p VERSION)" = "$OCTAVE_LINUX_VERSION"

      - name: Install pinned GNU Octave on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          brew install --force-bottle octave
          test "$(octave-config -p VERSION)" = "$OCTAVE_MACOS_VERSION"

      - name: Stage and re-attest selected runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="build/reference/test/${{ matrix.target }}/${{ matrix.profile }}"
          record="build/reference/records/${{ matrix.target }}-${{ matrix.profile }}.json"
          verify_record="build/reference/records/${{ matrix.target }}-${{ matrix.profile }}-verify.json"
          python consumer-kit/tools/stage-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --cache build/reference-cache --output "$root/runtime" --record "$record"
          python consumer-kit/tools/verify-runtime.py --receipt "$REFERENCE_RUNTIME_RECEIPT" --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --cache build/reference-cache --runtime "$root/runtime" --record "$verify_record"
          python consumer-kit/tools/prepare-test-layout.py --package-root "$root" --mex "build/reference/candidate/${{ matrix.target }}/bridge.mex" --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --runtime-record "$record" --backend reference-bridge/python/mock_backend.py --host-fixture reference-bridge/host/mock_smoke.m

      - name: Execute GNU Octave host acceptance on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & consumer-kit/tools/test-octave.ps1 -PackageRoot "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}" -Octave $env:REFERENCE_OCTAVE

      - name: Execute GNU Octave host acceptance on Linux
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          bash consumer-kit/tools/test-octave-linux.sh --package-root "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}" --octave "$(command -v octave-cli)"

      - name: Execute GNU Octave host acceptance on macOS
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          bash consumer-kit/tools/test-octave-macos.sh --package-root "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}" --octave "$(command -v octave-cli)"

      - name: Write exact-candidate qualification
        shell: bash
        run: |
          set -euo pipefail
          python consumer-kit/tools/write-qualification.py --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --mex "build/reference/candidate/${{ matrix.target }}/bridge.mex" --build-provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json" --runtime-receipt "build/reference/records/${{ matrix.target }}-${{ matrix.profile }}.json" --native-audit "build/reference/candidate/${{ matrix.target }}/native-audit.json" --output "build/reference/qualification-reference-${{ matrix.target }}-${{ matrix.profile }}.json" --check octave_host=pass --check repeated_calls=pass --check fresh_process=pass --check relocated_runtime=pass --check native_boundary=pass

      - name: Assemble deterministic reference package
        shell: bash
        run: |
          set -euo pipefail
          package="build/reference/packages/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-$REFERENCE_VERSION.${{ matrix.archive_ext }}"
          python consumer-kit/tools/package-reference.py --mex "build/reference/candidate/${{ matrix.target }}/bridge.mex" --runtime "build/reference/test/${{ matrix.target }}/${{ matrix.profile }}/runtime" --runtime-receipt "build/reference/records/${{ matrix.target }}-${{ matrix.profile }}.json" --build-evidence "build/reference/candidate/${{ matrix.target }}/build-provenance.json" --qualification-evidence "build/reference/qualification-reference-${{ matrix.target }}-${{ matrix.profile }}.json" --native-closure-evidence "build/reference/candidate/${{ matrix.target }}/native-audit.json" --backend reference-bridge/python/mock_backend.py --host-fixture reference-bridge/host/mock_smoke.m --platform "${{ matrix.target }}" --profile "${{ matrix.profile }}" --producer-revision "$RC2_PRODUCER_REVISION" --mock-revision "$GITHUB_SHA" --version "$REFERENCE_VERSION" --license LICENSE.txt --provenance "build/reference/candidate/${{ matrix.target }}/build-provenance.json" --output "$package"
          python consumer-kit/tools/write-sha256.py "$package"

      - name: Extract and test packaged bytes on Windows
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "build/reference/packages/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-$env:REFERENCE_VERSION.zip"
          $destination = "build/reference/relocated package with spaces"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $destination
          $root = Join-Path $destination "reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-$env:REFERENCE_VERSION"
          & (Join-Path $root "run-local-test.ps1") -Octave $env:REFERENCE_OCTAVE

      - name: Extract and test packaged bytes on Unix
        if: matrix.target != 'win-x64'
        shell: bash
        run: |
          set -euo pipefail
          package="build/reference/packages/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-$REFERENCE_VERSION.tar.gz"
          destination="build/reference/relocated package with spaces"
          mkdir -p "$destination"
          tar -xzf "$package" -C "$destination"
          root="$destination/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-$REFERENCE_VERSION"
          "$root/run-local-test.sh" --octave "$(command -v octave-cli)"

      - name: Reject tampered extracted package
        shell: bash
        run: |
          set -euo pipefail
          root="build/reference/relocated package with spaces/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-$REFERENCE_VERSION"
          python consumer-kit/tools/assert-tamper-detected.py --root "$root"

      - name: Upload qualified reference package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-package-${{ matrix.target }}-${{ matrix.profile }}
          path: |
            build/reference/packages/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-${{ env.REFERENCE_VERSION }}.${{ matrix.archive_ext }}
            build/reference/packages/reference-bridge-${{ matrix.target }}-cp314-${{ matrix.profile }}-${{ env.REFERENCE_VERSION }}.${{ matrix.archive_ext }}.sha256
            build/reference/qualification-reference-${{ matrix.target }}-${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 14
