name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate public producer policy
        run: python scripts/common/validate_repo.py

      - name: Compile Python sources
        run: python -m compileall -q scripts runtime tests

      - name: Test public producer policy checks
        run: python -m unittest discover -s tests/common -v

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Verify macOS immutable lock rendering
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            python scripts/macos/package_lock.py explicit \
              --lock "locks/macos/macos-${arch}-package-lock.json" \
              --source-explicit "locks/macos/macos-${arch}-explicit.txt" \
              --arch "${arch}" \
              --output "/tmp/macos-${arch}-explicit.txt"
          done

      - name: Verify Windows immutable lock rendering
        run: >-
          python scripts/windows/package_lock.py explicit
          --lock locks/windows/windows-x64-fenics-package-lock.json
          --source-explicit locks/windows/windows-x64-fenics-explicit.txt
          --arch x64
          --output /tmp/windows-x64-fenics-explicit.txt

  powershell:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }
              throw "PowerShell syntax validation failed: $($_.FullName)"
            }
          }
